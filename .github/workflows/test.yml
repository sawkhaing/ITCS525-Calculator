name: Testing
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calculator-server
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest -q
